name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 still ships Python 3.9, which the newer ubuntu-latest image dropped; the package
    # supports 3.9 (requires-python >= 3.9), so the matrix is pinned rather than losing that leg.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: pytest -q
